plugins:
  - name: "Complete"
    type: "Discovery"
    enabled: true
    settings: |
      {
        "intervalMinute": 10080,
        "autoStart": true,
        "startTimeSecond": 30
      }

  - name: "Devbox"
    type: "Discovery"
    enabled: true
    settings: |
      {
        "intervalMinute": 3000,
        "autoStart": false,
        "startTimeSecond": 30
      }

  - name: "Endpointslice"
    type: "Discovery"
    enabled: false
    settings: '{}'

  - name: "Deployment"
    type: "Discovery"
    enabled: true
    settings: |
      {
        "resyncTimeSecond": 5,
        "ageThresholdSecond": 300
      }

  - name: "StatefulSet"
    type: "Discovery"
    enabled: true
    settings: |
      {
        "resyncTimeSecond": 5,
        "ageThresholdSecond": 300
      }

  - name: "VLogPathDiscovery"
    type: "Discovery"
    enabled: false
    settings: |
      {
        "logServerPath": "${VLOG_LOG_SERVER_PATH}",
        "username": "${VLOG_USERNAME}",
        "password": "${VLOG_PASSWORD}",
        "app": "higress",
        "intervalHour": 6,
        "lookbackHour": 24,
        "bucketHour": 1,
        "topNPerHost": 50,
        "queryLimitPerBucket": 50,
        "maxGroupsPerRun": 500,
        "queryConcurrency": 3,
        "runTimeoutSecond": 900,
        "resyncTimeSecond": 30,
        "namespacePrefix": "ns-",
        "fields": {
          "time": "_time",
          "host": "host",
          "path": "path",
          "method": "method",
          "statusCode": "status_code",
          "responseContentType": "response_content_type"
        },
        "contentTypeAllowlist": ["text/html", "application/xhtml+xml"]
      }

  - name: "Browser"
    type: "Compliance"
    enabled: true
    settings: |
      {
        "timeout": 100,
        "maxWorkers": 20,
        "profiles": ["desktop", "mobile"]
      }

  - name: "Safety"
    type: "Compliance"
    enabled: true
    settings: |
      {
        "maxWorkers": 20,
        "adminBaseURL": "http://sealos-complik-admin:8080",
        "adminTimeoutSecond": 10,
        "adminBasicAuthUsername": "${ADMIN_BASIC_AUTH_USERNAME}",
        "adminBasicAuthPassword": "${ADMIN_BASIC_AUTH_PASSWORD}"
      }

  - name: "Custom"
    type: "Compliance"
    enabled: true
    settings: |
      {
        "maxWorkers": 20,
        "adminBaseURL": "http://sealos-complik-admin:8080",
        "adminTimeoutSecond": 10,
        "adminBasicAuthUsername": "${ADMIN_BASIC_AUTH_USERNAME}",
        "adminBasicAuthPassword": "${ADMIN_BASIC_AUTH_PASSWORD}"
      }

  - name: "AdminReporter"
    type: "Handle"
    enabled: true
    settings: |
      {
        "region": "${REGION}",
        "aggregationWindowSecond": 300,
        "maxAggregationBuckets": 1000,
        "maxPathsPerBucket": 50,
        "adminBaseURL": "http://sealos-complik-admin:8080",
        "adminTimeoutSecond": 10,
        "adminBasicAuthUsername": "${ADMIN_BASIC_AUTH_USERNAME}",
        "adminBasicAuthPassword": "${ADMIN_BASIC_AUTH_PASSWORD}"
      }

  - name: "Lark"
    type: "Handle"
    enabled: true
    settings: |
      {
        "region": "${REGION}",
        "adminBaseURL": "http://sealos-complik-admin:8080",
        "adminTimeoutSecond": 10,
        "adminBasicAuthUsername": "${ADMIN_BASIC_AUTH_USERNAME}",
        "adminBasicAuthPassword": "${ADMIN_BASIC_AUTH_PASSWORD}"
      }

logging:
  level: "info"

kubeconfig: "${KUBECONFIG_PATH}"
