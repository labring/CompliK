replicaCount: 1

image:
  repository: bearslyricattack/sealos-complik-service
  tag: "latest"
  pullPolicy: IfNotPresent

app:
  name: service-complik

namespace: complik

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 1000m
    memory: 1Gi

containerPort: 8428

browserRuntime:
  home: /tmp
  cacheHome: /tmp/.cache
  bin: /usr/bin/chromium

database:
  create: true

rbac:
  create: true
  name: complik-sa

external:
  region: "hzh"

  admin:
    baseURL: "http://sealos-complik-admin:8080"
    timeoutSecond: 10
    basicAuth:
      enabled: false
      secretName: sealos-complik-admin-auth
      usernameKey: username
      passwordKey: password

plugins:
  complete:
    enabled: true
    intervalMinute: 10080
    autoStart: false
    startTimeSecond: 30

  devbox:
    enabled: true
    intervalMinute: 3000
    autoStart: true
    startTimeSecond: 30

  endpointslice:
    enabled: false

  deployment:
    enabled: true
    resyncTimeSecond: 5
    ageThresholdSecond: 300

  statefulset:
    enabled: true
    resyncTimeSecond: 5
    ageThresholdSecond: 300

  vlogPathDiscovery:
    enabled: false
    logServerPath: ""
    username: ""
    password: ""
    app: higress
    intervalHour: 6
    lookbackHour: 24
    bucketHour: 1
    topNPerHost: 50
    queryLimitPerBucket: 50
    maxGroupsPerRun: 500
    queryConcurrency: 3
    runTimeoutSecond: 900
    resyncTimeSecond: 30
    namespacePrefix: ns-
    fields:
      time: _time
      host: host
      path: path
      method: method
      statusCode: status_code
      responseContentType: response_content_type
    contentTypeAllowlist:
      - text/html
      - application/xhtml+xml

  browser:
    enabled: true
    timeout: 100
    maxWorkers: 20
    profiles:
      - desktop
      - mobile

  safety:
    enabled: true
    maxWorkers: 20

  custom:
    enabled: false
    maxWorkers: 20

  adminReporter:
    enabled: true

  lark:
    enabled: true
    aggregationWindowSecond: 300
    maxAggregationBuckets: 1000
    maxPathsPerBucket: 50

config:
  logging:
    level: "info"

  kubeconfig: ""

kubeconfig:
  useServiceAccount: true
  configMapName: ""

procscan:
  enabled: false
  namespace: sealos
  image:
    tag: v0.0.2-alpha-6
  config:
    scanInterval: 100s
    larkWebhook: ""
