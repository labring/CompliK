name: Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_COMPLIK: ghcr.io/${{ github.repository_owner }}/complik
  GHCR_PROCSCAN: ghcr.io/${{ github.repository_owner }}/procscan
  GHCR_ADMIN: ghcr.io/${{ github.repository_owner }}/sealos-complik-admin
  GHCR_ADMIN_WEB: ghcr.io/${{ github.repository_owner }}/sealos-complik-admin-web
  GHCR_BLOCK_CONTROLLER: ghcr.io/${{ github.repository_owner }}/complik-block-controller
  GHCR_CLUSTER: ghcr.io/${{ github.repository_owner }}/cluster

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  detect-block-controller:
    name: Detect Block Controller
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Detect image context
        id: detect
        run: |
          if [ -f block-controller/Dockerfile ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  build-complik:
    name: Build CompliK (${{ matrix.arch }})
    needs: ci
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.sum
            go.work.sum
            complik/go.sum
            procscan/go.sum
            sealos-complik-admin/go.sum

      - name: Build binary
        working-directory: complik
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags "-s -w" \
            -o bin/service-complik-${{ matrix.arch }} cmd/complik/main.go

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.GHCR_COMPLIK }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: complik
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,"name=${{ env.GHCR_COMPLIK }}",name-canonical=true,push-by-digest=${{ github.event_name != 'pull_request' }},push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: digests-complik-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-procscan:
    name: Build ProcScan (${{ matrix.arch }})
    needs: ci
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.GHCR_PROCSCAN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: procscan
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,"name=${{ env.GHCR_PROCSCAN }}",name-canonical=true,push-by-digest=${{ github.event_name != 'pull_request' }},push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: digests-procscan-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-admin:
    name: Build Admin (${{ matrix.arch }})
    needs: ci
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    uses: ./.github/workflows/build-image.yml
    with:
      context: sealos-complik-admin
      image: ghcr.io/${{ github.repository_owner }}/sealos-complik-admin
      artifact-name-prefix: digests-admin
      arch: ${{ matrix.arch }}
      runs-on: ${{ matrix.runs-on }}

  build-admin-web:
    name: Build Admin Web (${{ matrix.arch }})
    needs: ci
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    uses: ./.github/workflows/build-image.yml
    with:
      context: sealos-complik-admin/web
      image: ghcr.io/${{ github.repository_owner }}/sealos-complik-admin-web
      artifact-name-prefix: digests-admin-web
      arch: ${{ matrix.arch }}
      runs-on: ${{ matrix.runs-on }}

  build-block-controller:
    name: Build Block Controller (${{ matrix.arch }})
    needs: [ci, detect-block-controller]
    if: ${{ needs.detect-block-controller.outputs.available == 'true' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    uses: ./.github/workflows/build-image.yml
    with:
      context: block-controller
      image: ghcr.io/${{ github.repository_owner }}/complik-block-controller
      artifact-name-prefix: digests-block-controller
      arch: ${{ matrix.arch }}
      runs-on: ${{ matrix.runs-on }}

  release-complik:
    name: Release CompliK Image
    permissions:
      packages: write
    needs: build-complik
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-complik-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.GHCR_COMPLIK }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for TAG in $DOCKER_METADATA_OUTPUT_TAGS; do
            docker buildx imagetools create -t "$TAG" \
              $(printf '${{ env.GHCR_COMPLIK }}@sha256:%s ' *)
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_COMPLIK }}:${{ steps.meta.outputs.version }}

  release-procscan:
    name: Release ProcScan Image
    permissions:
      packages: write
    needs: build-procscan
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-procscan-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.GHCR_PROCSCAN }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for TAG in $DOCKER_METADATA_OUTPUT_TAGS; do
            docker buildx imagetools create -t "$TAG" \
              $(printf '${{ env.GHCR_PROCSCAN }}@sha256:%s ' *)
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_PROCSCAN }}:${{ steps.meta.outputs.version }}

  release-admin:
    name: Release Admin Image
    permissions:
      packages: write
    needs: build-admin
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: digests-admin-amd64
          path: ${{ runner.temp }}/digests

      - name: Download arm64 digest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: digests-admin-arm64
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.GHCR_ADMIN }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for TAG in $DOCKER_METADATA_OUTPUT_TAGS; do
            docker buildx imagetools create -t "$TAG" \
              $(printf '${{ env.GHCR_ADMIN }}@sha256:%s ' *)
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_ADMIN }}:${{ steps.meta.outputs.version }}

  release-admin-web:
    name: Release Admin Web Image
    permissions:
      packages: write
    needs: build-admin-web
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-admin-web-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.GHCR_ADMIN_WEB }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for TAG in $DOCKER_METADATA_OUTPUT_TAGS; do
            docker buildx imagetools create -t "$TAG" \
              $(printf '${{ env.GHCR_ADMIN_WEB }}@sha256:%s ' *)
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_ADMIN_WEB }}:${{ steps.meta.outputs.version }}

  release-block-controller:
    name: Release Block Controller Image
    permissions:
      packages: write
    needs: build-block-controller
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' && needs.build-block-controller.result == 'success' }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-block-controller-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.GHCR_BLOCK_CONTROLLER }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for TAG in $DOCKER_METADATA_OUTPUT_TAGS; do
            docker buildx imagetools create -t "$TAG" \
              $(printf '${{ env.GHCR_BLOCK_CONTROLLER }}@sha256:%s ' *)
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_BLOCK_CONTROLLER }}:${{ steps.meta.outputs.version }}

  release-sealos-image:
    name: Release Sealos Cluster Image
    permissions:
      contents: read
      packages: write
    needs: [release-complik, release-procscan, release-admin, release-admin-web]
    runs-on: ubuntu-24.04
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install sealos CLI
        run: |
          curl -fsSL -o /tmp/install-sealos.sh https://raw.githubusercontent.com/labring/sealos/main/scripts/install.sh
          sh /tmp/install-sealos.sh -s --

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.GHCR_CLUSTER }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags in Helm values
        working-directory: complik/deploy/deploy
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          yq -i '.image.repository = strenv(GHCR_COMPLIK) | .image.tag = strenv(VERSION)' charts/complik/values.yaml
          yq -i '.image.repository = strenv(GHCR_PROCSCAN) | .image.tag = strenv(VERSION)' charts/procscan/values.yaml

      - name: Login to GHCR with sealos
        run: |
          sudo sealos login -u "${{ github.repository_owner }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io

      - name: Cache images for offline installation
        working-directory: complik/deploy/deploy
        run: |
          sudo sealos registry save --registry-dir=registry_amd64 --arch amd64 .
          sudo sealos registry save --registry-dir=registry_arm64 --arch arm64 .

      - name: Build and push cluster image
        working-directory: complik/deploy/deploy
        run: |
          for TAG in $DOCKER_METADATA_OUTPUT_TAGS; do
            sudo sealos build -t "$TAG" -f Kubefile .
            sudo sealos push "$TAG"
          done
